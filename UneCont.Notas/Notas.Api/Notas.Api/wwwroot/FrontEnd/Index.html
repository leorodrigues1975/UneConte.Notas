<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Notas Fiscais</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body class="container py-4">

    <h1 class="mb-4">Cadastro de Notas Fiscais</h1>

    <!-- Formulário -->
    <form id="formNota" class="row g-3">
        <div class="col-md-3">
            <label class="form-label">Número da Nota</label>
            <input type="number" class="form-control" id="numero" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Cliente</label>
            <input type="text" class="form-control" id="cliente" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Valor</label>
            <input type="number" step="0.01" class="form-control" id="valor" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Data de Emissão</label>
            <input type="date" class="form-control" id="dataEmissao" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>
    </form>

    <!-- Filtro -->
    <div class="mt-4">
        <label class="form-label">Filtrar por Cliente</label>
        <input type="text" id="filtroCliente" class="form-control" placeholder="Digite o nome do cliente">
    </div>

    <!-- Tabela -->
    <table class="table table-striped mt-4">
        <thead>
            <tr>
                <th>Id</th>
                <th>Número</th>
                <th>Cliente</th>
                <th><a href="#" id="ordenarValor">Valor ▲▼</a></th>
                <th>Data de Emissão</th>
                <th>Data de Cadastro</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaNotas"></tbody>
    </table>

    <!-- Modal Editar Nota -->
    <div class="modal fade" id="editNotaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editNotaForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar Nota Fiscal</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editNotaId" />
                        <div class="mb-3">
                            <label>Número da Nota</label>
                            <input type="text" id="editNumeroNota" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Cliente</label>
                            <input type="text" id="editCliente" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Valor</label>
                            <input type="number" id="editValor" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Data de Emissão</label>
                            <input type="date" id="editDataEmissao" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Data de Cadastro</label>
                            <input type="date" id="editDataCadastro" class="form-control" disabled>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // URL da API (ajuste a porta conforme seu backend estiver rodando)
        const apiUrl = "https://localhost:7020/api/notas";

        let notas = [];
        let ordenarAsc = true;

        // Buscar notas no backend
        function carregarNotas() {
            $.get(apiUrl + "/v1/Listar", function (data) {
                notas = data;
                renderTabela();
            });
        }

        // Renderizar tabela
        function renderTabela() {
            const filtro = $("#filtroCliente").val().toLowerCase();
            const lista = notas.filter(n => n.cliente.toLowerCase().includes(filtro));

            $("#tabelaNotas").empty();

            lista.forEach(n => {
                $("#tabelaNotas").append(`
                          <tr>
                            <td>${n.id}</td>
                            <td>${n.numero}</td>
                            <td>${n.cliente}</td>
                            <td>R$ ${n.valor.toFixed(2)}</td>
                            <td>${new Date(n.dataEmissao).toLocaleDateString()}</td>
                            <td>${new Date(n.dataCadastro).toLocaleString()}</td>
                            <td>
                              <button class="btn btn-sm btn-warning btn-editar" data-id="${n.id}">Alterar</button>
                              <button class="btn btn-sm btn-danger btn-excluir" data-id="${n.id}">Excluir</button>
                          </td>
                          </tr>
                        `);
            });
        }

        // Cadastro de nova nota
        $("#formNota").submit(function (e) {
            e.preventDefault();

            const nota = {
                numero: parseInt($("#numero").val()),
                cliente: $("#cliente").val(),
                valor: parseFloat($("#valor").val()),
                dataEmissao: $("#dataEmissao").val()
            };

            if (nota.valor <= 0) {
                alert("O valor deve ser maior que 0.");
                return;
            }

            $.ajax({
                url: apiUrl + "/v1/criar",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(nota),
                success: function () {
                    carregarNotas();
                    $("#formNota")[0].reset();
                },
                error: function (err) {
                    alert("Erro ao cadastrar nota: " + err.responseText);
                }
            });
        });

        // Abrir modal para edição
        $(document).on("click", ".btn-editar", function () {
            const id = $(this).data("id");

            $.get(apiUrl + "/v1/Listar", function (data) {
                const nota = data.find(n => n.id === id);
                if (nota) {
                    $("#editNotaId").val(nota.id);
                    $("#editNumeroNota").val(nota.numero);
                    $("#editCliente").val(nota.cliente);
                    $("#editValor").val(nota.valor);
                    $("#editDataEmissao").val(nota.dataEmissao.split("T")[0]);
                    $("#editDataCadastro").val(nota.dataCadastro.split("T")[0]);

                    const modal = new bootstrap.Modal(document.getElementById("editNotaModal"));
                    modal.show();
                }
            });
        });

        // Salvar alterações (PUT)
        $("#editNotaForm").submit(function (e) {
            e.preventDefault();
           
            const nota = {
                id: $("#editNotaId").val(),
                numero: $("#editNumeroNota").val(),
                cliente: $("#editCliente").val(),
                valor: parseFloat($("#editValor").val()),
                dataEmissao: $("#editDataEmissao").val(),
                dataCadastro: $("#editDataCadastro").val()
            };

            $.ajax({
                url: apiUrl + "/v1/Atualizar",
                type: "PUT",
                contentType: "application/json",
                data: JSON.stringify(nota),
                success: function () {
                    alert("Nota atualizada!");
                    const modal = bootstrap.Modal.getInstance(document.getElementById("editNotaModal"));
                    modal.hide();
                    carregarNotas();
                }
            });
        });

        // Filtro de cliente
        $("#filtroCliente").on("input", renderTabela);

        // Ordenação por valor
        $("#ordenarValor").click(function (e) {
            e.preventDefault();
            notas.sort((a, b) => ordenarAsc ? a.valor - b.valor : b.valor - a.valor);
            ordenarAsc = !ordenarAsc;
            renderTabela();
        });

        // Excluir Nota
        $(document).on("click", ".btn-excluir", function () {
            const id = $(this).data("id");
            if (confirm("Deseja realmente excluir esta nota?")) {
                $.ajax({
                    url: apiUrl + "/v1/Deletar/" + id,
                    type: "DELETE",
                    success: function () {
                        alert("Nota excluída!");
                        carregarNotas();
                    }
                });
            }
        });

        // Inicializa carregando notas
        carregarNotas();
    </script>
</body>
</html>
